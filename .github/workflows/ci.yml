name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no third-party modules, so nothing to cache

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Shell scripts
        run: shellcheck install.sh scripts/*.sh

      - name: Cross-compile
        run: make dist VERSION=ci
