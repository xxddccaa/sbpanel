name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Shell scripts
        run: shellcheck install.sh scripts/*.sh

      - name: Cross-compile
        run: make dist VERSION=ci
