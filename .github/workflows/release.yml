name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: make lint test

      - name: Build
        run: make dist VERSION=${{ github.ref_name }}

      - name: Release notes
        run: scripts/release-notes.sh "${{ github.ref_name }}" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --title "sbpanel $TAG" --notes-file notes.md "${flags[@]}"
